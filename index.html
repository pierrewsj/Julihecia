<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ef4f78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Julih & Cia — Pedidos</title>
  <link rel="manifest" href="manifest.json?v=5.0">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles-v5.css?v=5.0">
  <script>
  (()=>{
    const key='julih-v5-cache-reset';
    if(!localStorage.getItem(key)){
      localStorage.setItem(key,'1');
      if('caches' in window) caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});
      if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});
    }
  })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <script src="config.js?v=5.0"></script>
  <script src="app-v5.js?v=5.0" defer></script>
</body>
</html>
